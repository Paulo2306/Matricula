<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Cadastro de Cursos</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Cadastro de Cursos</h2>
        <form th:method="POST" th:action="@{/Cursos}">
            <input required type="text" placeholder="nome" th:name="nome">
            <input required type="text" placeholder="duracao" th:name="duracao">
            <button type="submit">Cadastrar</button>
            <a th:href="@{/listaCurso}">
                <button type="button">Voltar para Lista</button>
            </a>
        </form>
        <div th:if="${param.sucesso}" class="mensagem-sucesso">
            <p>Cadastro realizado com sucesso!</p>
        </div>
    </main>
    </body>
</html>
