
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Cadastro de Usuários</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <span th:replace="~{fragments/logout :: logout}"></span>
            </nav>
        </div>
    </header>

    <main>
        <h2>Cadastro de Usuários</h2>
        <p th:if="${erroLogin}" class="mensagem-erro">Este login já está em uso. Escolha outro.</p>
        <p th:if="${erroPessoa}" class="mensagem-erro">A pessoa selecionada não existe mais. Selecione novamente.</p>

        <form th:method="POST" th:action="@{/Usuarios}" enctype="multipart/form-data">

            <input required type="text" name="username" placeholder="Login" autocomplete="username" th:value="${loginInformado}">

            <input required type="password" name="password" placeholder="Senha" autocomplete="new-password">

            <input type="file" name="imagem">

            <select id="pessoa" name="pessoa">
                <option value="" disabled selected>Selecione uma pessoa</option>
                <option th:each="pessoa : ${listaPessoa}"
                        th:value="${pessoa.idPessoa}"
                        th:text="${pessoa.nome + ' - ' + pessoa.email}">
                </option>
            </select>


            <button type="submit">Cadastrar</button>
            <a th:href="@{/listaUsuario}">
                <button type="button">Voltar para Lista</button>
            </a>
        </form>

        <div th:if="${param.sucesso}" class="mensagem-sucesso">
            <p>Cadastro realizado com sucesso!</p>
        </div>
    </main>
    </body>
</html>
