<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Listar Usuários</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="lista-container">
            <div class="lista-toolbar">
                <h2>Usuários</h2>
                <a th:href="@{/cadastraUsuario}" class="btn-novo">Novo Usuário</a>
            </div>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Login</th>
                            <th>Papel</th>
                            <th>Foto</th>
                            <th>Pessoa</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${listaUsuarios}">
                            <td th:text="${usuario.id}"></td>
                            <td th:text="${usuario.login}"></td>
                            <td th:text="${usuario.papel}"></td>
                            <td><img th:if="${usuario.fotoPerfil != null and !#strings.isEmpty(usuario.fotoPerfil)}"
                                     th:src="${usuario.fotoPerfil}" alt="Foto de perfil" width="100" height="100"></td>
                            <td th:text="${usuario.pessoa != null ? usuario.pessoa.nome : 'Sem pessoa'}"></td>
                            <td>
                                <div class="acoes">
                                    <a th:href="@{/editarUsuario(id=${usuario.id})}" class="acao-editar">Editar</a>
                                    <a th:href="@{/excluirUsuario(id=${usuario.id})}" class="acao-excluir">Excluir</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="lista-footer">
                <a th:href="@{/dashboard}">
                    <button type="button" class="btn-secundario">← Voltar para Listas</button>
                </a>
            </div>
        </div>
    </main>
    </body>
</html>
