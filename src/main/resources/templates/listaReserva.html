<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Listar Reservas</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="lista-container">
            <div class="lista-toolbar">
                <h2>Reservas</h2>
                <a th:href="@{/cadastraReserva}" class="btn-novo">Nova Reserva</a>
            </div>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Data Reserva</th>
                            <th>Posição na Fila</th>
                            <th>Status</th>
                            <th>Aluno</th>
                            <th>Livro</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reserva : ${listaReservas}">
                            <td th:text="${reserva.id}"></td>
                            <td th:text="${reserva.dataReserva}"></td>
                            <td th:text="${reserva.posicaoFila}"></td>
                            <td th:text="${reserva.status}"></td>
                            <td th:text="${reserva.aluno.nome}"></td>
                            <td th:text="${reserva.livro.titulo}"></td>
                            <td>
                                <div class="acoes">
                                    <a th:href="@{/editarReserva(id=${reserva.id})}" class="acao-editar">Editar</a>
                                    <a th:href="@{/excluirReserva(id=${reserva.id})}" class="acao-excluir">Excluir</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="lista-footer">
                <a th:href="@{/dashboard}">
                    <button type="button" class="btn-secundario">← Voltar para Listas</button>
                </a>
            </div>
        </div>
    </main>
    </body>
</html>
