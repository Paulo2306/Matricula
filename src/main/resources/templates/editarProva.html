<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Edição de Provas</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Editar Prova</h2>

        <form th:action="@{/atualizarProva}" method="post">
            <input type="hidden" name="id" th:value="${prova.id}">

            <label>Data:</label>
            <input required type="date" name="data" th:value="${prova.data}">

            <label>Conteúdo:</label>
            <input required type="text" name="conteudo" th:value="${prova.conteudo}">

            <label>Peso:</label>
            <input required type="number" step="0.01" name="peso" th:value="${prova.peso}">

            <label>Oferta de Disciplina:</label>
            <select name="ofertaDisciplinaId" required>
                <option value="" disabled>Selecione a oferta</option>
                <option th:each="oferta : ${listaOfertaDisciplina}"
                        th:value="${oferta.id}"
                        th:text="${oferta.disciplina.nome + ' - ' + oferta.professor.nome}"
                        th:selected="${prova.ofertaDisciplina != null and oferta.id == prova.ofertaDisciplina.id}">
                </option>
            </select>

            <button type="submit">Salvar</button>
            <a th:href="@{/listaProva}"><button type="button">Cancelar</button></a>
        </form>
    </main>
    </body>
</html>
