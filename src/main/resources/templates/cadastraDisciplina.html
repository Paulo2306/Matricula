<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Cadastro de Disciplinas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Cadastro de Disciplinas</h2>
        <form th:method="POST" th:action="@{/Disciplinas}">

            <input required type="text" placeholder="nome" th:name="nome">

            <input required type="number" placeholder="carga horária" th:name="cargaHoraria">

            <select id="curso" name="curso" required>
                <option value="" disabled selected>Selecione um Curso</option>
                <option th:each="curso : ${listaCurso}" th:value="${curso.id}" th:text="${curso.nome}">
                </option>
            </select>

            <label>Livros:</label>
            <div class="lista-checkbox">
                <div class="checkbox-item" th:each="livro : ${listaLivros}">
                    <input type="checkbox" name="livrosIds" th:value="${livro.id}" th:id="'livro-' + ${livro.id}">
                    <label th:for="'livro-' + ${livro.id}" th:text="${livro.titulo}"></label>
                </div>
            </div>

            <button type="submit">Cadastrar</button>
            <a th:href="@{/listaDisciplina}">
                <button type="button">Voltar para Lista</button>
            </a>
        </form>
        <div th:if="${param.sucesso}" class="mensagem-sucesso">

            <p>Cadastro realizado com sucesso!</p>

        </div>
    </main>
</body>

</html>
