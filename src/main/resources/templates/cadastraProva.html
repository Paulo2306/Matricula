<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Cadastro de Provas</title>
        <meta charset="utf-8">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
        <h2>Cadastro de Provas</h2>
        <form th:method="POST" th:action="@{/Provas}">

            <input required type="date" th:name="data">

            <input required type="text" placeholder="conteúdo" th:name="conteudo">

            <input required type="number" step="0.01" placeholder="peso" th:name="peso">

            <select id="ofertaDisciplinaId" name="ofertaDisciplinaId" required>
                <option value="" disabled selected>Selecione a oferta</option>
                <option th:each="oferta : ${listaOfertaDisciplina}"
                        th:value="${oferta.id}"
                        th:text="${oferta.disciplina.nome + ' - ' + oferta.professor.nome}">
                </option>
            </select>

            <button type="submit">Cadastrar</button>
            <a th:href="@{/listaProva}">
                <button type="button">Voltar para Lista</button>
            </a>
        </form>

        <div th:if="${param.sucesso}" class="mensagem-sucesso">
            <p>Cadastro realizado com sucesso!</p>
        </div>
    </body>
</html>
