<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Edição de Disciplinas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Editar Disciplina</h2>

        <form th:action="@{/atualizarDisciplina}" method="post">

            <input type="hidden" name="id" th:value="${Disciplina.id}">

            <label>Nome:</label>
            <input required type="text" name="nome" th:value="${Disciplina.nome}">

            <label>Carga Horária:</label>
            <input required type="number" name="cargaHoraria" th:value="${Disciplina.cargaHoraria}">

            <label for="curso">Curso:</label>
            <select required id="curso" name="curso">
                <option value="" disabled>Selecione um Curso</option>
                <option th:each="curso : ${listaCurso}" th:value="${curso.id}" th:text="${curso.nome}"
                    th:selected="${Disciplina.curso != null and curso.id == Disciplina.curso.id}">
                </option>
            </select>

            <label>Livros:</label>
            <div class="lista-checkbox">
                <div class="checkbox-item" th:each="livro : ${listaLivros}">
                    <input type="checkbox" name="livrosIds" th:value="${livro.id}" th:id="'livro-' + ${livro.id}"
                        th:checked="${Disciplina.livros != null and #lists.contains(Disciplina.livros, livro)}">
                    <label th:for="'livro-' + ${livro.id}" th:text="${livro.titulo}"></label>
                </div>
            </div>

            <div class="botoes">
                <button type="submit">Salvar</button>
                <button type="button" th:onclick="|window.location.href='@{/listaDisciplina}'|">
                    Cancelar
                </button>
            </div>

        </form>
    </main>
</body>

</html>
