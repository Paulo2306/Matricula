<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Edição de Usuários</title>
        <meta charset="utf-8">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
        <h2>Editar Usuário</h2>
        <p th:if="${erroLogin}" class="mensagem-erro">Este login já está em uso por outro usuário. Escolha outro.</p>

        <form th:action="@{/atualizarUsuario}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${usuario.id}">

            <label>Login:</label>
            <input required type="text" name="login" th:value="${usuario.login}">

            <label>Senha:</label>
            <input required type="text" name="senhaHash" th:value="${usuario.senhaHash}">

            <label>Papel:</label>
            <select name="papel" required>
                <option value="" disabled>Selecione um papel</option>
                <option th:each="papel : ${listaPapel}"
                        th:value="${papel}"
                        th:text="${papel}"
                        th:selected="${usuario.papel != null and papel == usuario.papel}">
                </option>
            </select>

            <label>Foto de Perfil:</label>
              <img th:if="${usuario.fotoPerfil != null and !#strings.isEmpty(usuario.fotoPerfil)}"
                  th:src="${usuario.fotoPerfil}" alt="Foto de perfil atual" width="100" height="100">
              <input type="file" name="imagem" accept="image/*">

            <label>Pessoa:</label>
            <select name="pessoa">
                <option value="">Sem pessoa</option>
                <option th:each="pessoa : ${listaPessoa}"
                        th:value="${pessoa.idPessoa}"
                        th:text="${pessoa.nome + ' - ' + pessoa.email}"
                        th:selected="${usuario.pessoa != null and pessoa.idPessoa == usuario.pessoa.idPessoa}">
                </option>
            </select>

            <button type="submit">Salvar</button>
            <a th:href="@{/listaUsuario}"><button type="button">Cancelar</button></a>
        </form>
    </body>
</html>
