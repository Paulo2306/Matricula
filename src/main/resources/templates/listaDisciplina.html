<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Listar Disciplinas</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <div th:if="${erro}" class="mensagem erro">
            <span th:text="${erro}"></span>
        </div>

        <div th:if="${sucesso}" class="mensagem sucesso">
            <span th:text="${sucesso}"></span>
        </div>

        <div class="lista-container">
            <div class="lista-toolbar">
                <h2>Disciplinas</h2>
                <a th:href="@{/cadastraDisciplina}" class="btn-novo">Nova Disciplina</a>
            </div>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Carga Horária</th>
                            <th>Curso</th>
                            <th>Livros</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="Disciplina : ${listaDisciplinas}">
                            <td th:text="${Disciplina.id}"></td>
                            <td th:text="${Disciplina.nome}"></td>
                            <td th:text="${Disciplina.cargaHoraria}"></td>
                            <td th:text="${Disciplina.curso != null ? Disciplina.curso.nome : 'Nenhum'}"></td>
                            <td>
                                <span th:each="livro, iterStat : ${Disciplina.livros}">
                                    <span th:text="${livro.titulo}"></span><span th:if="${!iterStat.last}">, </span>
                                </span>
                                <span th:if="${#lists.isEmpty(Disciplina.livros)}">Nenhum</span>
                            </td>
                            <td>
                                <div class="acoes">
                                    <a th:href="@{/editarDisciplina(id=${Disciplina.id})}" class="acao-editar">Editar</a>
                                    <a th:href="@{/excluirDisciplina(id=${Disciplina.id})}" class="acao-excluir">Excluir</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="lista-footer">
                <a th:href="@{/dashboard}">
                    <button type="button" class="btn-secundario">← Voltar para Listas</button>
                </a>
            </div>
        </div>
    </main>
    </body>
</html>
