<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header><h1>Login</h1></header>

<main>
    <h2>Entrar</h2>
    <form th:action="@{/login}" method="post">
        <label for="username">Login:</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <div><button type="submit" class="botao">Entrar</button></div>
    </form>

    <div th:if="${param.erro}" class="mensagem-erro"><p>Login ou senha inválidos!</p></div>
    <div th:if="${param.sair}"><p>Você saiu do sistema. Sessão encerrada.</p></div>
    <div th:if="${param.expirou}"><p>Sua sessão expirou. Faça login novamente.</p></div>

    <p>Não tem conta? <a th:href="@{/cadastraUsuario}">Cadastre-se</a></p>
</main>

<footer>&copy; 2025 Sistema de Cadastro de Produtos de Tecnologia</footer>
</body>
</html>
