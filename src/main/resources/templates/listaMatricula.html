<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Lista de Matriculas</title>
        <meta charset="utf-8">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
        <h2>Lista de matriculas</h2>
        <div th:if="${erro}" class="mensagem erro">
            <span th:text="${erro}"></span>
        </div>

        <div th:if="${sucesso}" class="mensagem sucesso">
            <span th:text="${sucesso}"></span>
        </div>
        <table>
            <tr>
                <th>ID</th>
                <th>Aluno</th>
                <th>Oferta de Disciplina</th>
                <th>Ações</th>
            </tr>

            <tr th:each="ma : ${listaMatriculas}">
                <td th:text="${ma.id}"></td>
                <td th:text="${ma.aluno.nome != null ? ma.aluno.nome : 'Nenhum'}"></td>
                <td th:text="${ma.ofertaDisciplina != null and ma.ofertaDisciplina.disciplina != null ? ma.ofertaDisciplina.disciplina.nome + ' - ' + ma.ofertaDisciplina.professor.nome : 'Nenhuma'}"></td>

                <td>
                    <a th:href="@{/editarMatricula(id=${ma.id})}">Editar</a>
                    <a th:href="@{/excluirMatricula(id=${ma.id})}">Excluir</a>
                </td>
            </tr>
            <div class="botoes-lista">

                <a th:href="@{/cadastraMatricula}">
                    <button type="button">Novo Cadastro</button>
                </a>

                <a th:href="@{/dashboard}">
                    <button type="button">Voltar para Listas</button>
                </a>

            </div>

        </table>
    </body>
</html>
