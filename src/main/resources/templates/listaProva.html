<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Listar Provas</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="lista-container">
            <div class="lista-toolbar">
                <h2>Provas</h2>
                <a th:href="@{/cadastraProva}" class="btn-novo">Nova Prova</a>
            </div>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Data</th>
                            <th>Conteúdo</th>
                            <th>Peso</th>
                            <th>Oferta</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prova : ${listaProvas}">
                            <td th:text="${prova.id}"></td>
                            <td th:text="${prova.data}"></td>
                            <td th:text="${prova.conteudo}"></td>
                            <td th:text="${prova.peso}"></td>
                            <td th:text="${prova.ofertaDisciplina.disciplina.nome}"></td>
                            <td>
                                <div class="acoes">
                                    <a th:href="@{/editarProva(id=${prova.id})}" class="acao-editar">Editar</a>
                                    <a th:href="@{/excluirProva(id=${prova.id})}" class="acao-excluir">Excluir</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="lista-footer">
                <a th:href="@{/dashboard}">
                    <button type="button" class="btn-secundario">← Voltar para Listas</button>
                </a>
            </div>
        </div>
    </main>
    </body>
</html>
