<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Cadastro de Reservas</title>
        <meta charset="utf-8">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
        <h2>Cadastro de Reservas</h2>
        <form th:method="POST" th:action="@{/Reservas}">

            <input required type="date" th:name="dataReserva">

            <input required type="number" min="1" th:name="posicaoFila">

            <select id="status" name="status" required>
                <option value="" disabled selected>Selecione o status</option>
                <option th:each="status : ${listaStatusReserva}"
                        th:value="${status}"
                        th:text="${status}">
                </option>
            </select>

            <select id="alunoId" name="alunoId" required>
                <option value="" disabled selected>Selecione o aluno</option>
                <option th:each="aluno : ${listaAluno}"
                        th:value="${aluno.idPessoa}"
                        th:text="${aluno.nome}">
                </option>
            </select>

            <select id="livroId" name="livroId" required>
                <option value="" disabled selected>Selecione o livro</option>
                <option th:each="livro : ${listaLivro}"
                        th:value="${livro.id}"
                        th:text="${livro.titulo}">
                </option>
            </select>

            <button type="submit">Cadastrar</button>
            <a th:href="@{/listaReserva}">
                <button type="button">Voltar para Lista</button>
            </a>
        </form>

        <div th:if="${param.sucesso}" class="mensagem-sucesso">
            <p>Cadastro realizado com sucesso!</p>
        </div>
    </body>
</html>
