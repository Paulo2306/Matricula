<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Listar Exemplares</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="lista-container">
            <div class="lista-toolbar">
                <h2>Exemplares</h2>
                <a th:href="@{/cadastraExemplar}" class="btn-novo">Novo Exemplar</a>
            </div>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tombo</th>
                            <th>Status</th>
                            <th>Livro</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="exemplar : ${listaExemplares}">
                            <td th:text="${exemplar.id}"></td>
                            <td th:text="${exemplar.tombo}"></td>
                            <td th:text="${exemplar.status}"></td>
                            <td th:text="${exemplar.livro.titulo}"></td>
                            <td>
                                <div class="acoes">
                                    <a th:href="@{/editarExemplar(id=${exemplar.id})}" class="acao-editar">Editar</a>
                                    <a th:href="@{/excluirExemplar(id=${exemplar.id})}" class="acao-excluir">Excluir</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="lista-footer">
                <a th:href="@{/dashboard}">
                    <button type="button" class="btn-secundario">← Voltar para Listas</button>
                </a>
            </div>
        </div>
    </main>
    </body>
</html>
