<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Lista de Ofertas de Disciplinas</title>
        <meta charset="utf-8">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
        <h2>Lista de Ofertas de Disciplinas</h2>
        <div th:if="${erro}" class="mensagem erro">
            <span th:text="${erro}"></span>
        </div>

        <div th:if="${sucesso}" class="mensagem sucesso">
            <span th:text="${sucesso}"></span>
        </div>
        <table>
            <tr>
                <th>ID</th>
                <th>Professor</th>
                <th>Disciplina</th>
                <th>Ações</th>
            </tr>

            <tr th:each="oferta : ${listaOfertaDisciplinas}">
                <td th:text="${oferta.id}"></td>
                <td th:text="${oferta.professor.nome != null ? oferta.professor.nome : 'Nenhum'}"></td>
                <td th:text="${oferta.disciplina != null ? oferta.disciplina.nome + ' - ' + oferta.disciplina.curso.nome : 'Nenhuma'}"></td>

                <td>
                    <a th:href="@{/editarOfertaDisciplina(id=${oferta.id})}">Editar</a>
                    <a th:href="@{/excluirOfertaDisciplina(id=${oferta.id})}">Excluir</a>
                </td>
            </tr>
            <div class="botoes-lista">

                <a th:href="@{/cadastraOfertaDisciplina}">
                    <button type="button">Novo Cadastro</button>
                </a>

                <a th:href="@{/dashboard}">
                    <button type="button">Voltar para Listas</button>
                </a>

            </div>
        </table>
    </body>
</html>
