<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Listar Cursos</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/estilo.css}">
    </head>
    <body>
    <header>
        <div class="header-inner">
            <a th:href="@{/dashboard}" class="header-logo">
                <span class="logo-icon">SM</span>
                Sistema Matrícula
            </a>
            <nav>
                <a th:href="@{/dashboard}">Início</a>
                <a th:href="@{/login}">Sair</a>
            </nav>
        </div>
    </header>

    <main>
        <div th:if="${erro}" class="mensagem erro">
            <span th:text="${erro}"></span>
        </div>

        <div th:if="${sucesso}" class="mensagem sucesso">
            <span th:text="${sucesso}"></span>
        </div>

        <div class="lista-container">
            <div class="lista-toolbar">
                <h2>Cursos</h2>
                <a th:href="@{/cadastraCurso}" class="btn-novo">Novo Curso</a>
            </div>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Duração</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="Curso : ${listaCursos}">
                            <td th:text="${Curso.id}"></td>
                            <td th:text="${Curso.nome}"></td>
                            <td th:text="${Curso.duracao}"></td>
                            <td>
                                <div class="acoes">
                                    <a th:href="@{/editarCurso(id=${Curso.id})}" class="acao-editar">Editar</a>
                                    <a th:href="@{/excluirCurso(id=${Curso.id})}" class="acao-excluir">Excluir</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="lista-footer">
                <a th:href="@{/dashboard}">
                    <button type="button" class="btn-secundario">← Voltar para Listas</button>
                </a>
            </div>
        </div>
    </main>
    </body>
</html>
